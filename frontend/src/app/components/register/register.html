<section class="auth-page">
  <div class="auth-card register-card">
    <div class="auth-header">
      <h2>Create Account</h2>
      <p>Sign up to take the career assessment</p>
    </div>

    @if (error) {
      <div class="error-alert">{{ error }}</div>
    }

    <form (ngSubmit)="onSubmit()">
      <div class="form-row">
        <div class="form-group">
          <label for="firstName">First Name</label>
          <input type="text" id="firstName" [(ngModel)]="form.firstName" name="firstName" placeholder="First name" required />
        </div>
        <div class="form-group">
          <label for="lastName">Last Name</label>
          <input type="text" id="lastName" [(ngModel)]="form.lastName" name="lastName" placeholder="Last name" required />
        </div>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" [(ngModel)]="form.email" name="email" placeholder="Enter your email" required />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" [(ngModel)]="form.password" name="password" placeholder="Min 6 characters" required />
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" [(ngModel)]="confirmPassword" name="confirmPassword" placeholder="Confirm password" required />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="phone">Phone</label>
          <input type="tel" id="phone" [(ngModel)]="form.phone" name="phone" placeholder="Phone number" />
        </div>
        <div class="form-group">
          <label for="educationLevel">Education Level</label>
          <select id="educationLevel" [(ngModel)]="form.educationLevel" name="educationLevel">
            <option value="CLASS_8_9">Class 8-9</option>
            <option value="CLASS_10_12">Class 10-12</option>
            <option value="GRADUATE">Graduate</option>
            <option value="PROFESSIONAL">Professional</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="schoolName">School/College</label>
          <input type="text" id="schoolName" [(ngModel)]="form.schoolName" name="schoolName" placeholder="School or college name" />
        </div>
        <div class="form-group">
          <label for="city">City</label>
          <input type="text" id="city" [(ngModel)]="form.city" name="city" placeholder="Your city" />
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-lg" style="width: 100%" [disabled]="loading">
        {{ loading ? 'Creating Account...' : 'Sign Up Free' }}
      </button>
    </form>

    <div class="auth-footer">
      <p>Already have an account? <a routerLink="/login">Login</a></p>
    </div>
  </div>
</section>
