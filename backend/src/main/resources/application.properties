# Server
server.port=8080

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/career_assessment_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=career_app
spring.datasource.password=career_pass_123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=CareerAssessmentSecretKey2024VeryLongSecretKeyForJWTTokenGeneration
app.jwt.expiration-ms=86400000

# CORS
app.cors.allowed-origins=http://localhost:4200

# Initial admin account (seeded on startup if it does not exist).
# Override the password via the ADMIN_PASSWORD environment variable in real deployments.
app.admin.email=${ADMIN_EMAIL:admin@careerpath.com}
app.admin.password=${ADMIN_PASSWORD:Admin@12345}
app.admin.first-name=Platform
app.admin.last-name=Admin

# File size
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
